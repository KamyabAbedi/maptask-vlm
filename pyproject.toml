[project]
name = "maptask-vlm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kamyab", email = "kamyababedi@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "marimo>=0.24.0",
    "pandera>=0.32.1",
    "polars>=1.44.1",
]

[project.scripts]
maptask-vlm = "maptask_vlm:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
    "ty>=0.0.75",
]

[tool.ruff.lint.per-file-ignores]
# Marimo cell functions intentionally end with a bare "display" expression
# and/or an explicit `return` -- both are normal Marimo notebook idioms, not
# bugs, so we don't want ruff flagging them here.
"notebooks/*.py" = ["B018", "PLR1711"]

[tool.ty.src]
exclude = ["src/maptask_vlm/models/*"]
